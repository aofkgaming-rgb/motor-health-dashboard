services:
  - type: web
    name: motor-health-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Shared secret Board B sends in the X-Device-Key header.
      # Set the value in the Render dashboard (Environment), never in this file.
      - key: DEVICE_KEY
        sync: false
      # Run the labelled demo when no device is connected (true/false).
      - key: DEMO_AUTOSTART
        value: "true"
      # Where settings, users, maintenance, audit log and day files are stored.
      # Free plan: the disk is wiped on every redeploy/restart, so use
      # Administration -> System & data -> Download backup after changes.
      # With a paid persistent disk mounted at /var/data, set DATA_DIR=/var/data.
      # - key: DATA_DIR
      #   value: /var/data
